<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Progress Report · Logan English</title>
<style>
:root{color-scheme:light}
body{margin:0; background:#f1eceb; min-height:100vh}
.msg{max-width:520px; margin:12vh auto; padding:28px 22px; background:#fff; border-radius:14px; text-align:center; color:#3d3536;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6}
@media (min-width:600px){ #app{padding:24px 0} #app .wv{border-radius:16px; box-shadow:0 2px 14px rgba(20,30,40,.08)} }
/* Palette: Sanzo Wada, A Dictionary of Color Combinations, No. 191 — Blue #006eb8, Light Brown Drab #b59392, Yellow Ocher #e2b540 */
/* logo lockup: icon image + "LOGAN ENGLISH" as text (size it with font-size on .le-logo) */
.le-logo{display:inline-flex; align-items:center; gap:.22em; line-height:1; color:#006eb8; white-space:nowrap; vertical-align:middle}
.le-logo img{height:1.02em; width:auto; display:block; position:relative; top:-.09em}
.le-logo span{font-family:"DIN Condensed","Avenir Next Condensed","Bebas Neue","Oswald","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;
  font-weight:700; font-stretch:condensed; letter-spacing:0; font-size:1em; position:relative; top:.06em}
/* where supported, trim the text to its capital letters so the icon centres exactly on them */
@supports (text-box: trim-both cap alphabetic){
  .le-logo span{text-box:trim-both cap alphabetic; top:0}
  .le-logo img{top:0}
}

/* parent web page (scoped to .wv) */
.wv{--wb:#006eb8; --wbd:#00528a; --wbt:#e8f1f9; --wd:#b59392; --wdd:#7a5c5b; --wdt:#f6eeed; --wo:#e2b540; --wot:#fcf4e1;
  --wline:#e3d6d4; --wi:#17202b; --wm:#6a5d5e;
  max-width:560px; margin:0 auto; padding:22px 18px 28px; background:#fff; color:var(--wi);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; word-break:keep-all; overflow-wrap:break-word}
.wv *{box-sizing:border-box}
.wv-top{display:flex; flex-wrap:wrap-reverse; justify-content:flex-end; align-items:center; gap:10px 12px; padding-bottom:12px; margin-bottom:14px;
  border-bottom:3px solid var(--wb); border-image:linear-gradient(90deg,var(--wb) 0%,var(--wd) 62%,var(--wo) 100%) 1}
.wv-top .le-logo{font-size:23px; margin-right:auto}
.wv h1{font-size:30px; font-weight:800; color:var(--wb); margin:0; line-height:1.1; letter-spacing:-.01em}
.wv .per{margin:4px 0 0; color:var(--wm); font-size:15px}
.wv-lang{display:inline-flex; flex:none}
.wv-lang button{font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--wline); background:#fff; color:var(--wi); cursor:pointer; border-radius:0}
.wv-lang button:first-child{border-radius:7px 0 0 7px} .wv-lang button:last-child{border-radius:0 7px 7px 0; margin-left:-1px}
.wv-lang button[aria-pressed="true"]{background:var(--wb); border-color:var(--wb); color:#fff}
.wv-ids{margin:18px 0 6px}
.wv-ids .lab{font-weight:700; font-size:14px; margin:12px 0 5px; color:var(--wdd)}
.wv-ids .box{border:2px solid var(--wb); border-radius:11px; padding:9px 14px; font-size:20px; min-height:48px}
.wv-ids .kr{margin-right:10px}
.wv-hero{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 4px}
.wv-hero.one{grid-template-columns:1fr}
.wv-hero .card{border-radius:13px; padding:12px 14px; border-top:3px solid var(--wo); background:linear-gradient(165deg,var(--wbt) 0%,#fff 75%)}
.wv-hero .card.avg{border-top-color:var(--wd); background:linear-gradient(165deg,var(--wdt) 0%,#fff 75%)}
.wv-hero .lab{font-size:13px; font-weight:700; color:var(--wdd)}
.wv-hero .big{font-size:40px; font-weight:800; color:var(--wbd); line-height:1.1; font-variant-numeric:tabular-nums}
.wv-hero .avg .big{color:var(--wdd)}
.wv-hero .sub{font-size:13px; color:var(--wm)}
.wv-sec{margin-top:22px}
.wv-sec h2{font-size:18px; font-weight:800; color:var(--wbd); margin:0 0 10px}
.wv-bk{margin-bottom:12px}
.wv-bk .hd{display:flex; align-items:center; gap:8px; font-size:16px}
.wv-bk .pc{margin-left:auto; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums}
.wv-bk .bar{height:10px; border-radius:5px; background:var(--wdt); overflow:hidden; margin:5px 0 3px}
.wv-bk .bar i{display:block; height:100%; border-radius:5px}
.wv-bk .bar i.s{background:linear-gradient(90deg,var(--wbd),var(--wb) 70%,#3f93cc)} .wv-bk .bar i.o{background:linear-gradient(90deg,#c4921f,var(--wo))}
.wv-bk .sub{font-size:13px; color:var(--wm)}
.wv .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; flex:none}
.wv .dot.s{background:var(--wb)} .wv .dot.o{background:var(--wo)}
table.wv-t{width:100%; border-collapse:collapse; table-layout:fixed; font-size:15px}
.wv-t col.no{width:36px} .wv-t col.sc{width:60px}
.wv-t th,.wv-t td{border:1px solid var(--wline); padding:8px 8px; vertical-align:middle}
.wv-t th.banner{background:var(--wb); border-color:var(--wb); color:#fff; font-size:19px; text-align:left; padding:10px 12px}
.wv-t tr.cols th{font-size:13px; font-weight:700; text-align:left; background:#fff; color:var(--wdd)}
.wv-t tr.cols th:first-child{background:var(--wdt)}
.wv-t .c{text-align:center; font-variant-numeric:tabular-nums}
.wv-t td.no{background:var(--wdt); text-align:center; font-size:13px; color:var(--wdd)}
.wv-t tr.nd td{color:#9a8e8f}
.wv-t .nd-mark{color:#b3a7a8}
.wv .note{font-size:13px; color:var(--wm); margin:8px 0 0}
.wv-cmt{border:1px solid #dcc8c6; background:linear-gradient(180deg,var(--wdt),#fff); border-radius:12px; padding:12px 14px; white-space:pre-wrap}
.wv-cmt .sig{display:block; text-align:right; color:var(--wm); font-size:13px; margin-top:6px}
.wv-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:26px; padding-top:12px; border-top:1px solid var(--wline); color:var(--wm); font-size:13px}
.wv-foot .le-logo{font-size:17px}
@media (max-width:380px){ .wv{padding:18px 12px 24px} .wv-hero .big{font-size:34px} .wv-t{font-size:14px} .wv-t col.sc{width:52px} .wv-t th,.wv-t td{padding:7px 6px} }
@media print{ .wv-lang{display:none} }

</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== parent web page: shared by the hosted viewer and the maker's preview ===== */
const VIEW = (() => {
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => { if(n === null || n === undefined || n === "") return ""; const v = Math.round(Number(n)*10)/10; return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const monthNo = w => MON[w.slice(0,3).toLowerCase()];
function periodText(p, y, en){
  p = String(p || "").trim(); y = String(y || "").trim();
  if(en) return [p, y].filter(Boolean).join(" ");
  const ko = p.replace(/[A-Za-z]+/g, w => monthNo(w) ? monthNo(w) + "월" : w).replace(/월\s*[-–]\s*(\d+)월/, "–$1월");
  return y ? (ko ? `${y}년 ${ko}` : `${y}년`) : ko;
}
function dateText(d, en){
  if(!d) return ""; const x = new Date(d + "T00:00:00"); if(isNaN(x)) return "";
  return en ? x.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"}) : `${x.getFullYear()}. ${x.getMonth()+1}. ${x.getDate()}.`;
}

/* ----- link encoding: JSON → deflate → base64url, kept after the # so it never reaches the server ----- */
const b64u = u8 => { let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "=";
  const b = atob(s), u = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function pipe(u8, ts){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer()); }
async function encode(P){
  const raw = new TextEncoder().encode(JSON.stringify(P));
  if(typeof CompressionStream !== "undefined"){ try { return "z" + b64u(await pipe(raw, new CompressionStream("deflate-raw"))); } catch(e){} }
  return "j" + b64u(raw);
}
async function decode(code){
  code = String(code || "").replace(/^#/, "").replace(/^r=/, "");
  if(!code) return null;
  const kind = code[0], u = unb64u(code.slice(1)); let raw;
  if(kind === "z"){
    if(typeof DecompressionStream === "undefined") throw new Error("old-browser");
    raw = await pipe(u, new DecompressionStream("deflate-raw"));
  } else if(kind === "j") raw = u; else throw new Error("bad-link");
  const P = JSON.parse(new TextDecoder().decode(raw));
  if(!P || P.v !== 1 || !Array.isArray(P.i)) throw new Error("bad-link");
  return P;
}

/* ----- logo: icon image + "LOGAN ENGLISH" as text ----- */
const logo = icon => `<span class="le-logo"><img src="${icon}" alt=""><span>LOGAN ENGLISH</span></span>`;

/* ----- the page ----- */
function render(P, en, icon){
  const tx = (e, k) => en ? e : k;
  const pc = x => x === null || x === undefined ? "—" : Math.round(x) + "%";
  const weighted = P.m === "w";
  const cmt = en ? (P.k?.[1] || "") : (P.k?.[0] || P.k?.[1] || "");
  const [done, total] = [P.e?.[2] ?? 0, P.e?.[3] ?? P.i.length];
  let diff = "";
  if(P.a !== null && P.a !== undefined && P.o !== null){
    const d = Math.round(P.o) - Math.round(P.a);
    diff = d > 0 ? tx(`▲ ${d} points above the average`, `▲ 반 평균보다 ${d}점 높음`)
         : d < 0 ? tx(`▼ ${-d} points below the average`, `▼ 반 평균보다 ${-d}점 낮음`)
         : tx("Same as the class average", "반 평균과 같음");
  }
  const hasAvg = P.a !== null && P.a !== undefined;
  const hero = `<div class="wv-hero${hasAvg ? "" : " one"}">
      <div class="card"><div class="lab">${tx("Overall score", "종합 점수")}</div><div class="big">${pc(P.o)}</div>
        <div class="sub">${tx(`${done} of ${total} assignments completed`, `과제 ${total}개 중 ${done}개 완료`)}</div></div>
      ${hasAvg ? `<div class="card avg"><div class="lab">${tx("Class average", "반 평균")}</div><div class="big">${pc(P.a)}</div><div class="sub">${diff}</div></div>` : ""}
    </div>`;
  let brk;
  if(weighted){
    const row = (cls, lab, v, w, dn, tot) => `<div class="wv-bk"><div class="hd"><span class="dot ${cls}"></span><b>${lab}</b><span class="pc">${pc(v)}</span></div>
        <div class="bar"><i class="${cls}" style="width:${v === null || v === undefined ? 0 : Math.max(0, Math.min(100, v))}%"></i></div>
        <div class="sub">${tx(`Counts ${w}% of the overall score · ${dn} of ${tot} completed`, `종합 점수의 ${w}% 반영 · ${tot}개 중 ${dn}개 완료`)}</div></div>`;
    brk = `<section class="wv-sec"><h2>${tx("Score breakdown", "영역별 점수")}</h2>
      ${row("s", tx("Spelling & Vocabulary", "철자·어휘"), P.s?.[0], P.w, P.s?.[1] ?? 0, P.s?.[2] ?? 0)}
      ${row("o", tx("Tests & Assignments", "시험·과제"), P.x?.[0], 100 - P.w, P.x?.[1] ?? 0, P.x?.[2] ?? 0)}</section>`;
  } else {
    brk = `<section class="wv-sec"><h2>${tx("Score breakdown", "영역별 점수")}</h2><div class="wv-bk"><div class="hd"><b>${tx("Points earned", "획득 점수")}</b>
      <span class="pc">${fmt(P.e?.[0])} / ${fmt(P.e?.[1])}</span></div><div class="sub">${tx("On the completed assignments", "완료한 과제 기준")}</div></div></section>`;
  }
  const rows = P.i.map((it, k) => {
    const [name, pos, sc, cat] = it;
    return `<tr${sc === null || sc === undefined ? ' class="nd"' : ""}><td class="no">${k+1}</td>
      <td>${weighted && cat ? `<span class="dot ${cat === "S" ? "s" : "o"}"></span>` : ""}${esc(name)}</td>
      <td class="c">${sc === null || sc === undefined ? `<span class="nd-mark">—</span>` : fmt(sc)}</td><td class="c">${fmt(pos)}</td></tr>`;
  }).join("");
  const how = weighted ? tx(`Overall score = ${P.w}% Spelling & Vocabulary + ${100 - P.w}% Tests & Assignments.`, `종합 점수 = 철자·어휘 ${P.w}% + 시험·과제 ${100 - P.w}%.`)
                       : tx("Overall score = points earned ÷ points possible.", "종합 점수 = 획득 점수 ÷ 만점 합계.");
  return `<div class="wv">
    <div class="wv-top">${icon ? logo(icon) : ""}
      <div class="wv-lang" role="group" aria-label="Language"><button type="button" data-lang="ko" aria-pressed="${!en}">한국어</button><button type="button" data-lang="en" aria-pressed="${en}">English</button></div></div>
    <h1>Progress Report</h1><p class="per">${esc(periodText(P.p, P.y, en))}${en ? "" : " · 학습 성취 보고서"}</p>
    <div class="wv-ids">
      <div class="lab">${tx("This report card is for", "학생")}</div><div class="box">${P.n?.[0] ? `<span class="kr">${esc(P.n[0])}</span>` : ""}${esc(P.n?.[1] || "")}</div>
      <div class="lab">${tx("Class", "반")}</div><div class="box">${esc(P.c || "")}</div>
    </div>
    ${hero}${brk}
    <section class="wv-sec"><table class="wv-t"><colgroup><col class="no"><col><col class="sc"><col class="sc"></colgroup>
      <thead><tr><th colspan="4" class="banner">${tx("Grades", "과제별 점수")}</th></tr>
      <tr class="cols"><th></th><th>${tx("Assignment", "과제")}</th><th class="c">${tx("Score", "점수")}</th><th class="c">${tx("Out of", "만점")}</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="note">${weighted ? `<span class="dot s"></span>${tx("Spelling & Vocabulary", "철자·어휘")} &nbsp; <span class="dot o"></span>${tx("Tests & Assignments", "시험·과제")}<br>` : ""}
        ${tx("— = not completed, so not counted. ", "— = 미완료 과제로, 점수에 포함되지 않습니다. ")}${how}</p></section>
    ${cmt ? `<section class="wv-sec"><h2>${tx("Teacher’s comment", "선생님 코멘트")}</h2><div class="wv-cmt">${esc(cmt)}<span class="sig">${esc(P.t || "")}</span></div></section>` : ""}
    <footer class="wv-foot"><span>${esc(dateText(P.d, en))}</span>${icon ? logo(icon) : ""}</footer>
  </div>`;
}
return {esc, fmt, periodText, dateText, encode, decode, render, logo};
})();
if(typeof module !== "undefined") module.exports = VIEW;

</script>
