title: Logan English Academy
# Canonical address. Used for <link rel="canonical">, og:url and feed links,
# so search engines treat www as the one true copy of the site.
url: "https://www.loganenglishacademy.com"
author:
  name: Logan Leeder
  email: freshevryday@gmail.com

# Short line used after the site name in the browser-tab title of the homepage.
tagline: "전주 원어민 영어 학원 · Genuine English"
lang: ko

description: >
  로건원어민영어는 전주의 원어민 영어 학원입니다. 목표는 하나, 영어 유창성.
  English Only 수업과 소수 정예 맞춤 지도로 듣고, 말하고, 읽고, 토론하며
  영어를 일상의 언어로 만듭니다.


# Cloudflare Turnstile site key for the /consult/ form (optional; the Worker
# needs the matching TURNSTILE_SECRET). Empty = no challenge shown.
turnstile_site_key: ""

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Social-preview image for every page (KakaoTalk, Messenger, search results).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

# This repo started as the Minima theme itself; keep its own files off the site.
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - LICENSE.txt
  - minima.gemspec
  - readme_banner.svg
  - script/
  - _config_theme-dev.yml
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

sass:
  quiet_deps: true
  silence_deprecations: [import]

minima:
  # Minima skin selection. Available skins are:
  #   Available skins:
  #     * classic            Default, light color scheme.
  #     * dark               Dark variant of the classic skin.
  #     * auto               Adaptive skin based on the default classic and dark skins.
  #     * solarized-light    Light variant of solarized color scheme.
  #     * solarized-dark     Dark variant of solarized color scheme.
  #     * solarized          Adaptive skin for solarized color scheme skins.
  skin: classic
