*{box-sizing:border-box}

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if(v===""||v===null||v===undefined) return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
const fmt = n => { const v = Math.round(n*10)/10; return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const classById = id => S.classes.find(c => c.id===id);

function gradeOf(score){ const r = Math.round(score); for(const b of BANDS) if(r>=b.min) return b.g; return null; }
function tierOf(g){ if(g===null || g>=9) return "E"; if(g<=2) return "A"; if(g<=4) return "B"; if(g<=6) return "C"; return "D"; }
function bandRange(g){ const i = BANDS.findIndex(b=>b.g===g); const hi = i===0 ? 100 : BANDS[i-1].min-1; return BANDS[i].min + "–" + hi; }
const BAND_STOPS = [[1,[0,52,92]],[3,[0,110,184]],[6,[181,147,146]],[10,[242,235,233]]];
function bandRGB(g){
  if(g===null) return [247,243,242];
  for(let i=0;i<BAND_STOPS.length-1;i++){ const [g0,c0]=BAND_STOPS[i], [g1,c1]=BAND_STOPS[i+1];
    if(g>=g0 && g<=g1){ const t=(g-g0)/(g1-g0); return c0.map((v,k)=>Math.round(v+(c1[k]-v)*t)); } }
  return BAND_STOPS[BAND_STOPS.length-1][1];
}
function bandColor(g){ const [r,gg,b] = bandRGB(g); return `rgb(${r},${gg},${b})`; }
function bandInk(g){ const [r,gg,b] = bandRGB(g).map(v=>{v/=255; return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4)});
  return (0.2126*r+0.7152*gg+0.0722*b) < 0.28 ? "#ffffff" : "var(--paper-ink)"; }

function testRes(level, t){
  const [q1,q2] = S.q[level];
  if(S.settings.mode==="sections"){
    const s1 = num(t.s1), s2 = num(t.s2);
    if(s1===null || s2===null || s1<0 || s2<0 || s1>q1 || s2>q2) return null;
    return {level, score:(s1+s2)/(q1+q2)*100, s1, s2, q1, q2, sec:[s1/q1*100, s2/q2*100]};
  }
  const tot = num(t.total);
  if(tot===null || tot<0 || tot>100) return null;
  return {level, score:tot};
}
function result(st){
  const cls = classById(st.classId); if(!cls) return null;
  if(cls.level!=="COMBO"){ const a = testRes(cls.level, st.a); return a ? {lvl:cls.level, tests:[a], score:a.score} : null; }
  const a = testRes("JUNIOR", st.a), b = testRes("HIGH JUNIOR", st.b);
  if(!a && !b) return null;
  if(!a || !b){ const one = a||b; return {lvl:one.level, partial:true, tests:[one], score:one.score}; }
  const w = hjw().w;
  const score = a.score*(1-w) + b.score*w;
  return {lvl:"COMBO", tests:[a,b], score};
}
function classAverage(classId){
  if(S.fixedAvg!==undefined && S.fixedAvg!==null) return S.fixedAvg;
  const rs = S.students.filter(s=>s.classId===classId).map(result).filter(r=>r && !r.partial);
  if(rs.length<3) return null;
  return rs.reduce((t,r)=>t+r.score,0)/rs.length;
}

    C:{en:`building a solid base at the ${l} level.`, ko:`${l} 레벨의 기초를 다지고 있습니다.`},
    D:{en:`getting used to the ${l} level.`, ko:`${l} 레벨에 적응해 가는 단계입니다.`},
    E:{en:"best served by practice one level down for now.", ko:"당분간 한 단계 아래 레벨에서 기초를 다지면 좋습니다."}
  }[tierOf(gradeOf(r.score))];
}
function nextStep(r){
  if(r.lvl==="COMBO"){
    const j = r.tests[0].score, h = r.tests[1].score;
    if(h>=85) return {en:"Very strong at HIGH JUNIOR. Keep reading widely to hold this level.", ko:"HIGH JUNIOR 레벨에서도 매우 우수합니다. 다양한 글을 꾸준히 읽으며 실력을 유지해 주세요."};
    if(h>=60) return {en:"HIGH JUNIOR is a good fit. Next target: grade 2 (85+) at HIGH JUNIOR.", ko:"HIGH JUNIOR 레벨이 잘 맞습니다. 다음 목표는 HIGH JUNIOR 2급(85점 이상)입니다."};
    if(j>=85) return {en:"Strong at JUNIOR. HIGH JUNIOR is the next challenge; the first target there is grade 4 (60+).", ko:"JUNIOR 레벨은 충분히 우수합니다. 다음 과제는 HIGH JUNIOR이며, 첫 목표는 4급(60점 이상)입니다."};
    if(j>=60) return {en:"JUNIOR is the right level for now. Aim for grade 2 (85+) at JUNIOR before moving up.", ko:"현재는 JUNIOR 레벨이 적합합니다. JUNIOR 2급(85점 이상)을 달성한 뒤 상위 레벨에 도전하는 것을 권합니다."};
    return {en:"Focus on JUNIOR for now while building vocabulary and reading stamina.", ko:"당분간 JUNIOR 레벨에 집중하며 어휘력과 읽기 지구력을 키우는 것을 권합니다."};
  }
  const lvl = r.lvl, m = LV[lvl], t = tierOf(gradeOf(r.score));
  if(t==="A") return m.next ? {en:`Ready to try the ${m.next} level.`, ko:`${m.next} 레벨에 도전해 볼 만합니다.`}
                            : {en:"An excellent result at the highest school-age level.", ko:"학생 대상 최상위 레벨에서 매우 우수한 결과입니다."};
  if(t==="B") return {en:`${lvl} is a good fit. Next target: grade 2 (85+).`, ko:`${lvl} 레벨이 잘 맞습니다. 다음 목표는 2급(85점 이상)입니다.`};
  if(t==="C") return {en:`Stay at ${lvl} and keep building. Next target: grade 4 (60+).`, ko:`${lvl} 레벨에서 꾸준히 실력을 쌓아 주세요. 다음 목표는 4급(60점 이상)입니다.`};
  return {en:`Practice at the ${m.prev} level first, then return to ${lvl}.`, ko:`먼저 ${m.prev} 레벨로 연습한 뒤 ${lvl} 레벨에 다시 도전하는 것을 권합니다.`};
}
/* ---------- 5-step chart ---------- */
let svgUid = 0;
function stairs(r, cAvg, name){
  const W = 560, H = 222, base = 168, sw = 104, gap = 4, x0 = 12, hs = [26,44,62,80,98];
  const id = "st" + (++svgUid);
  const tStu = tierOf(gradeOf(r.score));
  const iStu = STEPS.findIndex(s=>s.t===tStu);
  const hasAvg = cAvg!==null && cAvg!==undefined;
  const iAvg = hasAvg ? STEPS.findIndex(s=>s.t===tierOf(gradeOf(cAvg))) : -1;
  let defs = "", body = "";
  STEPS.forEach((s,i) => {
    defs += `<linearGradient id="${id}g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c1}"/><stop offset="1" stop-color="${s.c2}"/></linearGradient>`;
    const x = x0 + i*(sw+gap), h = hs[i], y = base - h, on = i===iStu;
    body += `<rect x="${x}" y="${y}" width="${sw}" height="${h}" rx="3" fill="url(#${id}g${i})" opacity="${on?1:.38}"/>`;
    const cx = x + sw/2;
    body += `<text class="sn" x="${cx}" y="${base+18}" text-anchor="middle" opacity="${on?1:.62}">${tx(TIERS[s.t].en, TIERS[s.t].ko)}</text>`;
    body += `<text class="sg" x="${cx}" y="${base+34}" text-anchor="middle">${tx(`Grades ${s.g}`, `${s.g}급`)}</text>`;
    body += `<text class="sg" x="${cx}" y="${base+49}" text-anchor="middle">${tx(`${s.s} pts`, `${s.s}점`)}</text>`;
  });
  const pill = (i, row, text, fill, ink) => {
    const x = x0 + i*(sw+gap) + sw/2, top = base - hs[i];
    const w = Math.min(sw+18, text.length*(isEn()?7.6:8.6) + 18), y = top - 30 - row*28;
    const lx = Math.max(w/2+1, Math.min(W - w/2 - 1, x));
    return `<rect x="${(lx-w/2).toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="21" rx="10.5" fill="${fill}"/>`
      + `<path d="M${x-6} ${y+21} L${x+6} ${y+21} L${x} ${y+28} Z" fill="${fill}"/>`
      + `<text class="pl" x="${lx.toFixed(1)}" y="${y+15}" text-anchor="middle" fill="${ink}">${esc(text)}</text>`;
  };
  const nm = (name||"").length > 9 ? name.slice(0,8)+"…" : (name||tx("Student","학생"));
  let marks = "";
  marks += pill(iStu, 0, `${nm} ${fmt(r.score)}`, "var(--ocher)", "var(--paper-ink)");
  return `<svg class="stairs" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tx(TIERS[tStu].en,TIERS[tStu].ko))}"><defs>${defs}</defs>${body}${marks}</svg>`;
}

function handout(st){
  const r = result(st), cls = classById(st.classId), set = S.settings;
  const head = sheetHead(set) + `
    <div class="sh-id">
      <div class="idc">${Lab("Student","학생")}<span class="idv">${esc(st.name)||"&nbsp;"}</span></div>

      <div class="idc">${Lab("Test level","응시 레벨")}<span class="idv">${esc(cls?levelName(cls.level):"")}</span></div>
    </div>`;
  if(!r) return `<article class="sheet">${head}<div class="empty-sheet">${tx("Enter this student's scores to build the handout.","점수를 입력하면 성적표가 만들어집니다.")}</div></article>`;

  const g = gradeOf(r.score), t = tierOf(g), tier = TIERS[t];
  const name = st.name || tx("This student","이 학생");
  const hp = headlinePhrase(r);
  const headline = `<div class="headline">${tx(
    `${esc(name)} is at <b>${gradeWord(g)} (${tier.en})</b>: ${hp.en}`,
    `${esc(name)} 학생은 <b>${gradeWord(g)}(${tier.ko})</b>${g===null?"으로":"으로"}, ${hp.ko}`)}</div>`;

  // hero card: grade first, score second, class comparison under the score
  const big = g===null
    ? `<div class="big" style="font-size:26pt">${gradeWord(g)}</div>`
    : (isEn() ? `<div class="big"><span class="u pre">Grade</span>${g}</div>` : `<div class="big">${g}<span class="u">급</span></div>`);
  const combo = r.lvl==="COMBO";
  const scoreRow = `<div class="hero-row">${Lab(combo?"Combined score":"Score", combo?"종합 점수":"점수")}<span class="v">${fmt(r.score)}<small> / 100</small></span></div>`;
  let subs = "";
  if(combo){
    const hw = hjw();
    subs = `<div class="subs">
      <div><span>JUNIOR</span><span class="v">${fmt(r.tests[0].score)} · ${gradeWord(gradeOf(r.tests[0].score))}</span></div>
      <div><span>HIGH JUNIOR</span><span class="v">${fmt(r.tests[1].score)} · ${gradeWord(gradeOf(r.tests[1].score))}</span></div>
      <span class="note">${tx(`Combined: ${hw.short.en}`, `종합 점수: ${hw.short.ko}`)}</span></div>`;
  } else if(r.partial){
    subs = `<div class="subs"><span class="note">${tx(`Only the ${r.tests[0].level} test was recorded.`, `${r.tests[0].level} 시험 결과만 반영되었습니다.`)}</span></div>`;
  }
  const cAvg = set.classAvg ? classAverage(st.classId) : null;
  let cmp = "";
  if(cAvg!==null && cAvg!==undefined){
    const d = r.score - cAvg, ad = fmt(Math.abs(d));
    const diff = Math.abs(d) < 0.05 ? tx("Same as the class average","반 평균과 같음")
      : d > 0 ? tx(`▲ ${ad} above the class average`,`▲ 반 평균보다 ${ad}점 높음`)
              : tx(`▼ ${ad} below the class average`,`▼ 반 평균보다 ${ad}점 낮음`);
    cmp = `<div class="cmp">
        <div class="cmp-row"><span class="n">${esc(name)}</span><div class="cmp-track"><div class="cmp-fill me" style="width:${Math.max(0,Math.min(100,r.score)).toFixed(1)}%"></div></div><span class="v">${fmt(r.score)}</span></div>
        <div class="cmp-row"><span class="n">${tx("Class avg","반 평균")}</span><div class="cmp-track"><div class="cmp-fill cls" style="width:${Math.max(0,Math.min(100,cAvg)).toFixed(1)}%"></div></div><span class="v">${fmt(cAvg)}</span></div>
        <div class="cmp-diff">${diff}</div></div>`;
  }
  const main = `
    <div class="main">
      <div class="hero">
        ${Lab("Grade","등급")}

        <div class="tier">${tx(tier.en, tier.ko)}</div>

      <div class="chartbox">

        ${stairs(r, cAvg, st.name)}
      </div>

  // strength / focus
  let skills = "", weak = -1;
  if(set.mode==="sections"){
    let p, detail;
    if(combo){
      const w = hjw().w, [a,b] = r.tests;
      p = [a.sec[0]*(1-w)+b.sec[0]*w, a.sec[1]*(1-w)+b.sec[1]*w];
      detail = i => `JR ${i?a.s2:a.s1}/${i?a.q2:a.q1} · HJ ${i?b.s2:b.s1}/${i?b.q2:b.q1}`;
    } else {
      const a = r.tests[0]; p = a.sec;
      detail = i => `${i?a.s2:a.s1}/${i?a.q2:a.q1}`;
    }
    const strong = p[0] >= p[1] ? 0 : 1; weak = 1 - strong;
    const card = (cls2, icon, en, ko, i) => `<div class="skill ${cls2}"><span class="ic">${icon}</span>
        <div>${Lab(en, ko)}<div class="nm">${tx(SEC[i].en, SEC[i].ko)}</div></div>
        <div class="d"><b>${fmt(p[i])}%</b>${detail(i)}</div></div>`;
    const balanced = Math.abs(p[0]-p[1]) < 10;
    skills = `<div class="g-sec">${H("Skills","영역별 결과")}
      <div class="skills">${card("str","✓","Strength","강점",strong)}${card("foc","→","Focus next","보완",weak)}</div>
      ${balanced ? `<div class="skill-note">${tx("The two sections are within 10 percentage points of each other, so the results are fairly balanced.","두 영역의 차이가 10%p 미만으로, 전체적으로 고른 편입니다.")}</div>` : ""}</div>`;
  }

  const ns = nextStep(r), mean = meaning(r, name);
  const cText = isEn() ? (st.comment||"").trim() : ((st.commentKo||"").trim() || (st.comment||"").trim());
  const comment = cText ? `${H("Teacher's Comment","선생님 코멘트")}<div class="comment">${esc(cText)}<span class="sig">${esc(set.teacher)}</span></div>` : "";
  const bottom = `
    <div class="bottom${comment ? "" : " solo"}">
      <div class="blk">
        ${H("Next Step","다음 단계")}
        <div class="nextstep">${tx(ns.en, ns.ko)}</div>
        ${H("What It Means","결과 해석")}
        <p class="meaning">${tx(mean.en, mean.ko)}</p>
      </div>
      ${comment ? `<div class="blk">${comment}</div>` : ""}
    </div>`;
  const foot = `<div class="sh-foot">
      <div class="see">${tx("For how grades, steps and scores work, see the “How to Read This Report” page.","등급·단계·점수 계산 방법은 별지 「성적표 읽는 법」을 참고해 주세요.")}</div>
      <div>${practiceNotice(set)}</div></div>`;
  return `<article class="sheet">${head}${headline}${main}${skills}${bottom}${foot}</article>`;
}

/* ---------- link codec: one student's report packed into the URL fragment (#r1…) ----------
   The fragment never reaches the web server, so scores stay between the teacher and the parent. */
function b64urlEncode(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "=";
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encodeReport(st){
  const cls = classById(st.classId), set = S.settings, lvl = cls.level, sec = set.mode==="sections";
  const sc = t => sec ? [num(t.s1), num(t.s2)] : [num(t.total)];
  const levels = lvl==="COMBO" ? ["JUNIOR","HIGH JUNIOR"] : [lvl];
  const p = {v:1, l:set.lang==="en"?"en":"ko", a:set.academy, t:set.teacher, d:set.date, m:sec?"s":"t", w:set.hjw,
    n:st.name, c:cls.name, lv:lvl, q:levels.map(l => S.q[l]), s:sc(st.a)};
  if(lvl==="COMBO") p.h = sc(st.b);
  const avg = set.classAvg ? classAverage(st.classId) : null;
  if(avg!==null && avg!==undefined) p.g = Math.round(avg*100)/100;
  const k = p.l==="en" ? String(st.comment||"").trim() : (String(st.commentKo||"").trim() || String(st.comment||"").trim());
  if(k) p.k = k;
  return "r1" + b64urlEncode(JSON.stringify(p));
}
function decodeReport(hash){
  const h = String(hash||"").replace(/^#/,"");
  if(h.slice(0,2)!=="r1") throw new Error("not a report link");
  const p = JSON.parse(b64urlDecode(h.slice(2)));
  const str = (v, max) => String(v==null ? "" : v).slice(0, max);
  const n = v => { const x = num(v); return x===null ? "" : x; };
  const lv = ["BASIC","JUNIOR","HIGH JUNIOR","COMBO"].includes(p.lv) ? p.lv : null;
  if(!lv || !Array.isArray(p.s)) throw new Error("incomplete link");
  const total = p.m==="t", lang = p.l==="en" ? "en" : "ko", k = str(p.k, 1200);
  const q = {"BASIC":[30,30], "JUNIOR":[30,30], "HIGH JUNIOR":[30,35]};
  (lv==="COMBO" ? ["JUNIOR","HIGH JUNIOR"] : [lv]).forEach((l,i) => {
    const qq = Array.isArray(p.q) && p.q[i];
    if(Array.isArray(qq) && qq.every(x => Number.isInteger(x) && x>0 && x<=200)) q[l] = [qq[0], qq[1]];
  });
  const part = arr => { arr = Array.isArray(arr) ? arr : []; return total ? {s1:"", s2:"", total:n(arr[0])} : {s1:n(arr[0]), s2:n(arr[1]), total:""}; };
  return {
    settings:{academy:str(p.a,80), teacher:str(p.t,60), date:/^\d{4}-\d{2}-\d{2}$/.test(p.d||"") ? p.d : "", lang,
      mode: total ? "total" : "sections", hjw: HJW[p.w] ? String(p.w) : "67", classAvg: typeof p.g==="number"},
    q, classes:[{id:"c", name:str(p.c,40), level:lv}],
    students:[{id:"s", name:str(p.n,40), classId:"c", a:part(p.s), b:part(p.h), comment: lang==="en" ? k : "", commentKo: lang==="ko" ? k : ""}],
    selected:"s", fixedAvg: typeof p.g==="number" && isFinite(p.g) ? Math.max(0, Math.min(100, p.g)) : undefined };
}
/* The web version shows the guide underneath instead of on a separate sheet. */
function forWeb(html){
  return html.replace("별지 「성적표 읽는 법」을", "아래 「성적표 읽는 법」을").replace("see the “How to Read This Report” page.", "see “How to Read This Report” below.");
}
